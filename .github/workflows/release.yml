name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build installable ZIP
        run: git archive --format=zip --prefix=whatsappbutton/ --output=local_whatsappbutton.zip HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" local_whatsappbutton.zip
          --title "${GITHUB_REF_NAME}"
          --generate-notes
